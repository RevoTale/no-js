when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

depends_on: [test]

steps:
  - name: release-please
    image: node:26.12.1-trixie@sha256:97fa0f1b59035c6072721a88d55be1371c7cb1cc942b521e1cc5c72ec87655f4
    environment:
      GITHUB_TOKEN:
        from_secret: forge_token
    commands:
      - >-
        npx --yes release-please@17.11.2 github-release
        --repo-url "$${CI_REPO}" --target-branch "$${CI_REPO_DEFAULT_BRANCH}"
        --token "$${GITHUB_TOKEN}"
        --config-file release-please-config.json --manifest-file .release-please-manifest.json
      - >-
        npx --yes release-please@17.11.2 release-pr
        --repo-url "$${CI_REPO}" --target-branch "$${CI_REPO_DEFAULT_BRANCH}"
        --token "$${GITHUB_TOKEN}"
        --config-file release-please-config.json --manifest-file .release-please-manifest.json
