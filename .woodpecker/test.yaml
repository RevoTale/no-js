when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: [pull_request, manual, tag]

depends_on: [validate]

steps:
  - name: test
    image: golang:1.27.3-trixie@sha256:af1bfc2614ebb1dbd31af514b78740fd678850e76498762b425ecee4c5c6ea80
    environment:
      GOTOOLCHAIN: auto
    commands:
      - sh scripts/ci-install-task.sh
      - task ci:tools
      - task test
