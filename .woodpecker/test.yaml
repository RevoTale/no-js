when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: [pull_request, manual, tag]

depends_on: [validate]

steps:
  - name: test
    image: golang:1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e
    environment:
      GOTOOLCHAIN: auto
    commands:
      - sh scripts/ci-install-task.sh
      - task ci:tools
      - task test
